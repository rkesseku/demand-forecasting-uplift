[project]
name = "demand-forecasting-uplift"
version = "0.1.0"
description = "Hybrid demand forecasting (Prophet, statsforecast, gradient boosting) and causal uplift estimation (DoWhy, EconML) for promotions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Reagan Kesseku" }]
license = { text = "MIT" }
keywords = ["forecasting", "causal-inference", "uplift", "double-ml", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "statsforecast>=1.7",
    "xgboost>=2.0",
    "prophet>=1.1.5",
    "dowhy>=0.11",
    "econml>=0.15",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0"]

[project.scripts]
demand-uplift = "demand_uplift.cli:main"

[project.urls]
Homepage = "https://github.com/rkesseku/demand-forecasting-uplift"
Repository = "https://github.com/rkesseku/demand-forecasting-uplift"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["demand_uplift*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning", "ignore::DeprecationWarning"]
